name: Publish to npm

# Publish on a version tag (e.g. `git tag v0.3.3 && git push --tags`).
# No manual `npm publish`, no forgot-to-bump 403s — the tag IS the release.
# No token either: npm trusts this workflow (trusted publishing, GitHub's OIDC identity), set on
# npmjs.com under @memxai/cairn > Settings > Trusted Publisher: GitHub Actions, Abhishekxdg / cairn,
# publish.yml. A token was refused for want of a one-time password; this never needs one.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # trusted publishing needs npm 11.5.1 or later (Node 22 comes with 10)
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG != package.json $PKG — bump package.json to match the tag"
            exit 1
          fi
          echo "Releasing $PKG"

      # the CLI's tests run bin/cairn.js, which loads the build
      - run: npm run build

      - run: npm test

      - name: Publish
        run: npm publish --provenance --access public
